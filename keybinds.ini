# RCRness defaults: keyboard movement on WASD, actions on J/K.
[player1]
a = K
b = J
select = Backslash
start = Return
up = W
down = S
left = A
right = D

[player2]
a = Keypad 1
b = Keypad 2
select = Keypad 0
start = Keypad Enter
up = Up
down = Down
left = Left
right = Right

[gamepad1]
a = a,b
b = x,y
select = back
start = start
up = dpup
down = dpdown
left = dpleft
right = dpright
deadzone = 16000
analog = true
[gamepad2]
a = a,b
b = x,y
select = back
start = start
up = dpup
down = dpdown
left = dpleft
right = dpright
deadzone = 16000
